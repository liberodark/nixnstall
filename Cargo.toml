[package]
name = "nixnstall"
version = "0.1.0"
edition = "2024"
authors = ["liberodark"]
description = "Declarative TUI installer for NixOS flake projects"
license = "GPL-3.0"
repository = "https://github.com/liberodark/nixinstall"
keywords = ["nixos", "installer", "disko", "tui"]
categories = ["command-line-utilities", "os"]

[dependencies]
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
ratatui = "0.30"
crossterm = "0.29"
tokio = { version = "1", features = ["full", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
handlebars = "6"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

[dev-dependencies]
tempfile = "3"
pretty_assertions = "1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3

[lints.rust]
unsafe_code = "deny"
unused_imports = "deny"
dead_code = "deny"
